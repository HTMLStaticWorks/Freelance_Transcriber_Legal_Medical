<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | MedLex</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), #1e293b);
            position: relative;
            overflow: hidden;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 500;
            background: linear-gradient(45deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0;
            text-shadow: 0 10px 30px rgba(6, 182, 212, 0.2);
        }

        .floating-icon {
            position: absolute;
            opacity: 0.1;
            color: var(--secondary);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }
    </style>
</head>

<body>

    <div class="error-container">
        <!-- Animated Background Icons -->
        <i class="bi bi-file-earmark-x floating-icon" style="font-size: 8rem; top: 10%; left: 10%;"></i>
        <i class="bi bi-headphones floating-icon"
            style="font-size: 6rem; top: 60%; left: 80%; animation-delay: 1s;"></i>
        <i class="bi bi-shield-x floating-icon"
            style="font-size: 10rem; top: 20%; right: 15%; animation-delay: 2s;"></i>

        <div class="container text-center reveal z-1 position-relative">
            <div class="glass-card d-inline-block p-5 border-secondary border-opacity-50 text-center">
                <h1 class="error-code text-center">404</h1>
                <h2 class="display-6 mt-4 fw-bold text-center text-white">Oops! File Not Found</h2>
                <p class="text-muted lead max-w-700 mx-auto mt-3 mb-5">The page or transcript you are looking for has
                    been moved securely or doesn't exist.</p>
                <a href="index.html" class="btn btn-secondary-custom btn-lg rounded-pill px-5">
                    <i class="bi bi-house-door me-2"></i> Return Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
