<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MedLex</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1551150441-3f3828204ef0?w=2000&auto=format&fit=crop') center/cover;
            transition: var(--transition);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.98) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }

        .glass-card h3,
        .glass-card h2,
        .glass-card .auth-brand,
        .glass-card .form-label {
            color: white !important;
        }

        .glass-card .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        .auth-brand {
            color: white !important;
        }

        .auth-input {
            color: white !important;
        }

        /* Ensure form labels and text inside card are light */
        .glass-card .form-label,
        .glass-card .form-check-label {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        /* RTL Mode Alignment Corrections */
        [dir="rtl"] .auth-container .glass-card {
            direction: ltr !important;
            text-align: left !important;
        }

        [dir="rtl"] .auth-container .input-group > .border-end-0 {
            border-right: 1px solid rgba(255, 255, 255, 0.25) !important;
            border-left: 0 !important;
        }

        [dir="rtl"] .auth-container .input-group > .border-start-0 {
            border-left: 1px solid rgba(255, 255, 255, 0.25) !important;
            border-right: 0 !important;
        }

        [dir="rtl"] .auth-container .input-group > .form-control {
            border-left: 0 !important;
            border-right: 0 !important;
        }

        [dir="rtl"] .auth-container .input-group > .form-control:first-child {
            border-left: 1px solid rgba(255, 255, 255, 0.25) !important;
            border-right: 0 !important;
        }

        [dir="rtl"] .auth-container .input-group > .form-control:last-child {
            border-right: 1px solid rgba(255, 255, 255, 0.25) !important;
            border-left: 0 !important;
        }

        [dir="rtl"] .auth-container h2,
        [dir="rtl"] .auth-container p,
        [dir="rtl"] .auth-container .form-label,
        [dir="rtl"] .auth-container .form-check,
        [dir="rtl"] .auth-container .form-check-label,
        [dir="rtl"] .auth-container a,
        [dir="rtl"] .auth-container span,
        [dir="rtl"] .auth-container small {
            direction: ltr !important;
            unicode-bidi: plaintext !important;
        }
    </style>
</head>

<body>

    <div class="auth-container py-5 position-relative">
        <!-- Floating Toggles -->
        <div class="position-absolute top-0 end-0 p-4 d-flex gap-3 z-3">
            <button class="theme-toggle rtl-toggle" aria-label="Toggle RTL">
                <i class="bi bi-arrow-left-right"></i>
            </button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark Mode">
                <i class="bi bi-moon" id="theme-icon"></i>
            </button>
        </div>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-6 reveal">
                    <div class="glass-card text-start p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="auth-brand d-flex align-items-center justify-content-center gap-2">
                                <svg class="text-secondary flex-shrink-0" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="vertical-align: middle;">
                                    <!-- Shield Base: Legal, Security, Trust -->
                                    <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z" fill="url(#shieldGrad)" stroke="var(--secondary)" stroke-width="2" stroke-linejoin="round"/>
                                    <!-- Medical Cross: Medical Transcription Identity -->
                                    <path d="M12 7v6M9.5 10.5h5" stroke="var(--secondary)" stroke-width="2.5" stroke-linecap="round"/>
                                    <!-- Waveform Lines: Sound/Audio Transcription and Records -->
                                    <path d="M7.5 15.5h9M8.5 18.5h7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
                                    <!-- Dynamic Glowing Gradient -->
                                    <defs>
                                        <linearGradient id="shieldGrad" x1="12" y1="2" x2="12" y2="23" gradientUnits="userSpaceOnUse">
                                            <stop stop-color="rgba(6, 182, 212, 0.2)"/>
                                            <stop offset="1" stop-color="rgba(15, 23, 42, 0.7)"/>
                                        </linearGradient>
                                    </defs>
                                </svg>
                                MedLex
                            </a>
                        </div>
                        <h2 class="h3 fw-bold mb-1 text-center">Create Corporate Account</h2>
                        <p class="text-muted text-center mb-4 small">Set up your secure file transfer portal.</p>

                        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                            <div class="mb-3">
                                <label class="form-label text-muted small">Full Name</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-end-0"><i
                                            class="bi bi-person"></i></span>
                                    <input type="text"
                                        class="form-control bg-transparent border-secondary border-start-0 auth-input shadow-none"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small">Company / Clinic</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-end-0"><i
                                            class="bi bi-building"></i></span>
                                    <input type="text"
                                        class="form-control bg-transparent border-secondary border-start-0 auth-input shadow-none"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small">Email Address</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-end-0"><i
                                            class="bi bi-envelope"></i></span>
                                    <input type="email"
                                        class="form-control bg-transparent border-secondary border-start-0 auth-input shadow-none"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small">Phone Number</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-end-0"><i
                                            class="bi bi-telephone"></i></span>
                                    <input type="tel"
                                        class="form-control bg-transparent border-secondary border-start-0 auth-input shadow-none"
                                        required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted small">Password</label>
                                <div class="input-group mb-1">
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-end-0"><i
                                            class="bi bi-lock"></i></span>
                                    <input type="password"
                                        class="form-control bg-transparent border-secondary border-start-0 border-end-0 auth-input shadow-none"
                                        required>
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-start-0 password-toggle cursor-pointer"><i
                                            class="bi bi-eye"></i></span>
                                </div>
                                <!-- Password Strength Indicator -->
                                <div class="progress" style="height: 4px; background-color: rgba(255,255,255,0.1);">
                                    <div class="progress-bar bg-secondary w-50" role="progressbar"></div>
                                </div>
                                <small class="text-secondary mt-1">Medium strength</small>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted small">Confirm Password</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-end-0"><i
                                            class="bi bi-lock-fill"></i></span>
                                    <input type="password"
                                        class="form-control bg-transparent border-secondary border-start-0 border-end-0 auth-input shadow-none"
                                        required>
                                    <span
                                        class="input-group-text bg-transparent border-secondary text-muted border-start-0 password-toggle cursor-pointer"><i
                                            class="bi bi-eye"></i></span>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input bg-dark border-secondary" type="checkbox" required
                                    id="terms">
                                <label class="form-check-label text-muted small" for="terms">
                                    I agree to the <a href="#" class="text-secondary">Terms of Service</a> and HIPAA BAA
                                    requirements.
                                </label>
                            </div>

                            <button type="submit" class="btn btn-secondary-custom w-100 py-2 fw-bold mb-4">Create
                                Account</button>

                            <div class="text-center mb-4 text-muted small position-relative">
                                <span class="px-2 position-relative z-1"
                                    style="background-color: #0f172a !important; color: rgba(255,255,255,0.6) !important;">Or
                                    join with</span>
                                <hr
                                    class="position-absolute top-50 start-0 w-100 m-0 translate-middle-y border-secondary opacity-25">
                            </div>

                            <div class="d-flex flex-column flex-sm-row gap-2 mb-4">
                                <button type="button" class="btn btn-outline-secondary flex-fill"><i
                                        class="bi bi-google me-2"></i> Google</button>
                                <button type="button" class="btn btn-outline-secondary flex-fill"><i
                                        class="bi bi-apple me-2"></i> Apple</button>
                                <button type="button" class="btn btn-outline-secondary flex-fill"><i
                                        class="bi bi-microsoft me-2"></i> SSO</button>
                            </div>

                            <p class="text-center text-muted small mb-0">Already have an account? <a href="login.html"
                                    class="text-secondary fw-bold text-decoration-none">Sign In</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
